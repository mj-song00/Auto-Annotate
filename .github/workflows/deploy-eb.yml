name: Deploy to Elastic Beanstalk (S3 prefix)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew clean bootJar

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy
          JAR_PATH=$(ls build/libs/*.jar | head -n 1)
          cp "$JAR_PATH" deploy/app.jar

          if [ -f Procfile ]; then cp Procfile deploy/; fi
          if [ -d .platform ]; then cp -R .platform deploy/; fi

          cd deploy
          zip -r ../deploy.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload bundle to S3 (prefix)
        env:
          EB_BUCKET: ${{ secrets.EB_S3_BUCKET }}
        run: |
          PREFIX="deployments/${{ github.repository }}/main"
          KEY="${PREFIX}/app-${{ github.sha }}.zip"
          aws s3 cp deploy.zip "s3://${EB_BUCKET}/${KEY}"
          echo "S3_KEY=${KEY}" >> $GITHUB_ENV

      - name: Create application version
        env:
          EB_BUCKET: ${{ secrets.EB_S3_BUCKET }}
          APP: ${{ secrets.EB_APPLICATION_NAME }}
        run: |
          VERSION="github-${{ github.sha }}"
          aws elasticbeanstalk create-application-version \
            --application-name "${APP}" \
            --version-label "${VERSION}" \
            --source-bundle S3Bucket="${EB_BUCKET}",S3Key="${S3_KEY}"

      - name: Deploy version to environment
        env:
          ENV: ${{ secrets.EB_ENVIRONMENT_NAME }}
        run: |
          VERSION="github-${{ github.sha }}"
          aws elasticbeanstalk update-environment \
            --environment-name "${ENV}" \
            --version-label "${VERSION}"
