<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Highlight Automation</title>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            box-sizing: border-box;
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        aside {
            width: 240px;
            border-right: 1px solid #ddd;
            padding: 16px;
            box-sizing: border-box;
        }

        section#content {
            flex: 1;
            padding: 16px;
            box-sizing: border-box;
            overflow: auto;
        }

        ul.folder-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul.folder-list li {
            padding: 6px 4px;
            cursor: pointer;
        }

        ul.folder-list li.active {
            font-weight: bold;
        }

        .upload-center {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .upload-center button {
            margin-top: 12px;
        }

        .result-area {
            display: none;
        }

        .download-buttons button {
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

<div id="app">

    <header>
        <h1>Highlight Automation</h1>
        <button type="button">로그아웃</button>
    </header>

    <main>

        <!-- 왼쪽: 폴더 영역 (초기엔 비어 있음) -->
        <aside>
            <ul class="folder-list">
                <!-- 업로드 후 폴더 이름이 여기에 추가됨 -->
                <!-- <li class="active">2026-01</li> -->
            </ul>
        </aside>

        <!-- 오른쪽: 콘텐츠 영역 -->
        <section id="content">

            <!-- 초기 상태: 업로드 안내 -->
            <div class="upload-center">
                <p>PDF 파일을 업로드해 주세요.</p>
                <button type="button">파일 업로드</button>
            </div>

            <!-- 업로드 완료 후 상태 -->
            <div class="result-area">
                <h2>다운로드</h2>

                <div class="download-buttons">
                    <button id="dl0" type="button" disabled>
                        동일 병원 7일 이상 (엑셀)
                    </button>
                    <button id="dl1" type="button" disabled>
                        30일 이상 복용 (엑셀)
                    </button>
                    <button id="dl2" type="button" disabled>
                        입원 (엑셀)
                    </button>
                    <button id="dl3" type="button" disabled>
                        수술 (엑셀)
                    </button>
                </div>
            </div>

        </section>

    </main>

</div>

</body>
</html>
