<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-6">로그인</h1>

    <form id="loginForm" class="space-y-4">
        <div>
            <input type="email" id="email"
                   placeholder="이메일을 입력해주세요."
                   class="w-full px-3 py-2 border rounded"
                   autocomplete="email"
                   required>
        </div>

        <div>
            <input type="password" id="password"
                   placeholder="비밀번호를 입력해주세요."
                   class="w-full px-3 py-2 border rounded"
                   autocomplete="current-password"
                   required>
        </div>

        <p id="errorMessage" class="text-red-500 text-sm hidden"></p>

        <button type="submit"
                class="w-full py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            로그인
        </button>
    </form>

    <div class="mt-4 text-center text-sm">
        계정이 없으신가요?
        <a href="/signup" class="text-blue-500 underline">회원가입</a>
    </div>
</div>
<script src="/js/login.js"> </script>
</body>
</html>
