<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Highlight Automation</title>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            box-sizing: border-box;
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        aside {
            width: 240px;
            border-right: 1px solid #ddd;
            padding: 16px;
            box-sizing: border-box;
        }

        section#content {
            flex: 1;
            padding: 16px;
            box-sizing: border-box;
            overflow: auto;
        }

        ul.folder-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul.folder-list li {
            padding: 6px 4px;
            cursor: pointer;
        }

        ul.folder-list li.active {
            font-weight: bold;
        }

        .upload-center {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .upload-center button {
            margin-top: 12px;
        }

        .result-area {
            display: none;
        }

        .download-buttons button {
            display: block;
            margin-bottom: 8px;
        }

        /*.layout {*/
        /*    display: flex;*/
        /*    height: 100vh;*/
        /*}*/

        /*.sidebar {*/
        /*    width: 260px;*/
        /*    border-right: 1px solid #e5e7eb;*/
        /*    padding: 12px;*/
        /*    overflow-y: auto;*/
        /*    background-color: #f9fafb;*/
        /*}*/

        /*.content {*/
        /*    flex: 1;*/
        /*    padding: 20px;*/
        /*    overflow-y: auto;*/
        /*}*/
    </style>
</head>

<body>

<div id="app">

    <header>
        <h1>Highlight Automation</h1>
        <button type="button">로그아웃</button>
    </header>

    <main class="layout">

        <!-- 왼쪽: 폴더 영역 -->
        <aside class="sidebar">
            <ul id="folderList" class="folder-list">
                <!-- JS로 폴더 li 추가 -->
            </ul>
        </aside>

        <!-- 오른쪽: 콘텐츠 영역 -->
        <section id="content" class="content">

            <!-- 초기 상태: 업로드 안내 -->
            <div class="upload-center">
                <p>PDF 파일을 업로드해 주세요.</p>

                <input
                        type="text"
                        id="folderName"
                        placeholder="폴더 이름"
                        style="margin-bottom: 8px;"
                />

                <input
                        type="file"
                        id="fileInput"
                        multiple
                        style="display: none;"
                />

                <button type="button" id="uploadBtn">파일 업로드</button>
            </div>

            <!-- 업로드 완료 후 상태 -->
            <div class="result-area">
                <h2>다운로드</h2>

                <div class="download-buttons">
                    <button id="dl0" type="button" disabled>
                        동일 병원 7일 이상 (엑셀)
                    </button>
                    <button id="dl1" type="button" disabled>
                        30일 이상 복용 (엑셀)
                    </button>
                    <button id="dl2" type="button" disabled>
                        입원 (엑셀)
                    </button>
                    <button id="dl3" type="button" disabled>
                        수술 (엑셀)
                    </button>
                </div>
            </div>

        </section>
    </main>
</div>
<script>
    function getAccessToken() {
        return localStorage.getItem("accessToken");
    }

    function handleUnauthorized() {
        alert("인증이 만료되었습니다.");
        localStorage.removeItem("accessToken");
        window.location.href = "/login";
    }

    async function checkAuth(){
        const token = getAccessToken();

        if (!token || token.trim() === "") {
            alert("로그인이 필요합니다.");
            window.location.href = "/login";
            return;
        }
    }

    async function LoadProfile() {
        const token = getAccessToken();
        if (!token) {
            handleUnauthorized();
            return;
        }

        const response = await fetch("/api/v1/users/me/profile", {
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            handleUnauthorized();
            return;
        }

        if (!response.ok) {
            console.error("프로필 조회 실패", response.status);
            return;
        }
    }

    function bindLogoutButton() {
        const logoutBtn = document.querySelector("header button");
        if (!logoutBtn) return;

        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("accessToken");
            window.location.href = "/login";
        });
    }

    async function uploadFiles(files, folderName) {
        const token = getAccessToken();
        if (!token) {
            handleUnauthorized();
            return;
        }

        const formData = new FormData();

        for (const file of files) {
            formData.append("documents", file);
        }

        formData.append(
            "saveFolderRequest",
            new Blob(
                [JSON.stringify({ name: folderName })],
                { type: "application/json" }
            )
        );

        try {
            const response = await fetch("/api/v1/document/upload", {
                method: "POST",
                headers: {
                    Authorization: `Bearer ${token}`
                },
                body: formData
            });

            if (response.status === 401) {
                handleUnauthorized();
                return;
            }

            if (!response.ok) {
                console.error("업로드 실패", response.status);
                return;
            }

            console.log("업로드 성공");

            document.querySelector(".upload-center").style.display = "none";
            document.querySelector(".result-area").style.display = "block";

        } catch (e) {
            console.error("업로드 오류", e);
        }
    }

    //폴더 목록 불러오기
    async function getFolders() {
        const token = getAccessToken();
        if (!token) {
            handleUnauthorized();
            return;
        }

        try {
            const response = await fetch("/api/v1/folder", {
                method: "GET",
                headers: {
                    Authorization: `Bearer ${token}`
                },
            });

            if (response.status === 401) {
                handleUnauthorized();
                return;
            }

            const folders = await response.json();

            const folderList = document.getElementById("folderList");
            folderList.innerHTML = "";

            folders.forEach(folder => {
                console.log("append folder:", folder.name);
                const li = document.createElement("li");
                li.textContent = folder.name;
                li.dataset.folderId = folder.id;

                li.onclick = () => loadFolder(folder.id);

                folderList.appendChild(li);
            });


        } catch(e){
            console.log(e)
        }
    }

    window.addEventListener("load", () => {
        checkAuth()
        LoadProfile();
        bindLogoutButton();
        getFolders()

        const uploadBtn = document.getElementById("uploadBtn");
        const fileInput = document.getElementById("fileInput");
        const folderInput = document.getElementById("folderName");

        uploadBtn.addEventListener("click", () => {
            const folderName = folderInput.value.trim();

            if (!folderName) {
                alert("폴더 이름을 입력해주세요.");
                return;
            }

            fileInput.click();
        });

        fileInput.addEventListener("change", () => {
            const folderName = folderInput.value.trim();

            if (!folderName) {
                alert("폴더 이름을 입력해주세요.");
                fileInput.value = "";
                return;
            }

            if (!fileInput.files.length) return;

            uploadFiles(fileInput.files, folderName);

            // 같은 파일 재업로드 가능하게 초기화
            fileInput.value = "";
        });
    });
</script>
</body>
</html>
