<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Highlight Automation</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
<div id="app">
    <header>
        <h1>Highlight Automation</h1>
        <button type="button">로그아웃</button>
    </header>

    <main class="layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <span id="newUploadBtn" class="new-upload-link">+ 새 업로드</span>
            </div>
            <ul id="folderList" class="folder-list"></ul>
        </aside>

        <section id="content" class="content">
            <div class="upload-center">
                <p>PDF 파일을 업로드해 주세요.</p>

                <input type="text" id="folderName" placeholder="폴더 이름" style="margin-bottom: 8px;" />
                <input type="file" id="fileInput" multiple style="display: none;" />
                <button type="button" id="uploadBtn">파일 업로드</button>
            </div>

            <div class="result-area">
                <h2>다운로드</h2>

                <div class="download-buttons">
                    <button id="dl0" type="button" disabled data-condition="0">
                        동일 코드 7일 이상 (엑셀)
                    </button>
                    <button id="dl1" type="button" disabled data-condition="1">
                        30일 이상 복용 (엑셀)
                    </button>
                    <button id="dl2" type="button" disabled data-condition="2">
                        입원 (엑셀)
                    </button>
                    <button id="dl3" type="button" disabled data-condition="3">
                        수술 (엑셀)
                    </button>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="/js/main.js"></script>
</body>
</html>
